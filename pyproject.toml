[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poldergraph"
version = "0.1.5"
description = "Fully local, zero-cloud code intelligence graph for developers and coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PolderGraph contributors" }]
keywords = ["code-intelligence", "knowledge-graph", "embeddings", "mcp", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "typer>=0.15",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "orjson>=3.10",
  "networkx>=3.4",
  "pathspec>=0.12",
  "watchfiles>=1.0",
  "platformdirs>=4.3",
  "mcp>=1.2",
]

[project.optional-dependencies]
semantic = [
  "tree-sitter-language-pack>=0.9",
  "torch>=2.4",
  "transformers>=5.19,<6",
  "sentence-transformers>=6.1,<7",
  "torchvision>=0.19",
  "Pillow>=10.4",
  "pypdf>=5.1",
  "soundfile>=0.12",
  "numpy>=1.26",
]
vectors = [
  "sqlite-vec>=0.1.6",
]
communities = [
  "python-igraph>=0.11",
  "leidenalg>=0.10",
]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]
all = [
  "poldergraph[semantic,vectors,communities,api]",
]

[project.scripts]
poldergraph = "poldergraph.cli:main"

[project.urls]
Homepage = "https://github.com/poldergraph/poldergraph"
Documentation = "https://github.com/poldergraph/poldergraph/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/poldergraph"]

# The dashboard is built by `pnpm --dir web build` into web/dist and force-
# included into the wheel at src/poldergraph/web/dist, so `poldergraph ui`
# needs no Node.js on the end-user machine.
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "poldergraph/web/dist"

[tool.hatch.build.targets.sdist]
include = ["src/poldergraph", "omp", "package.json", "web/src", "web/dist", "web/package.json", "web/vite.config.ts", "web/tsconfig.json", "docs", "README.md", "AGENTS.md", "LICENSE", "tests"]

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: marks tests that require model downloads or heavy indexing",
  "e2e: marks browser/dashboard end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
