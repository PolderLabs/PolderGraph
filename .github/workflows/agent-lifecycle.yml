name: Agent lifecycle

on:
  pull_request:
  push:
    branches: [main]

jobs:
  omp-extension-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pinned OMP runtime
        run: npm install --prefix "$RUNNER_TEMP/omp-runtime" --no-audit --no-fund --save-exact bun@1.4.2 @oh-my-pi/pi-coding-agent@18.8.7
      - name: Add OMP and Bun to PATH
        run: echo "$RUNNER_TEMP/omp-runtime/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Exercise PolderGraph extension in OMP runtime
        run: node tests/omp/runtime_smoke.mjs
        env:
          OMP_BIN: ${{ runner.temp }}/omp-runtime/node_modules/.bin/omp
      - name: Verify OMP context cursor behavior
        run: bun tests/omp/context_cursor.mjs

  workspace-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build dashboard assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Install package and test runner
        run: uv pip install --system . pytest
      - name: Test bootstrap, locking, and generation consistency
        run: pytest -q tests/unit/test_agent_bootstrap.py tests/unit/test_index_supervisor.py tests/unit/test_query_generation.py tests/unit/test_query_daemon_platform.py tests/unit/test_codex_hook.py
      - name: Exercise actual MCP server startup and tool flow
        run: pytest -q tests/integration/test_mcp_contract.py
      - name: Test supervised local decision worker
        run: pytest -q tests/unit/test_decision_worker.py tests/unit/test_decision_runtime.py tests/unit/test_decisions.py
      - name: Test embedding space switching and vector reuse
        run: pytest -q tests/unit/test_parsing_and_indexing.py::TestIncrementalUpdate
      - name: Test daemon watcher and concurrent socket clients
        if: runner.os != 'Windows'
        run: pytest -q tests/integration/test_query_daemon.py
