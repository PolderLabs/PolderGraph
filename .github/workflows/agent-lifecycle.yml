name: Agent lifecycle

on:
  pull_request:
  push:
    branches: [main]

jobs:
  workspace-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build dashboard assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Install package and test runner
        run: uv pip install --system . pytest
      - name: Test bootstrap, locking, and generation consistency
        run: pytest -q --basetemp=.pytest-tmp tests/unit/test_agent_bootstrap.py tests/unit/test_index_supervisor.py tests/unit/test_query_generation.py
      - name: Test daemon watcher and concurrent socket clients
        if: runner.os != 'Windows'
        run: pytest -q --basetemp=.pytest-tmp tests/integration/test_query_daemon.py
