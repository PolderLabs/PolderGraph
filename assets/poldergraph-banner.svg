<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title description">
  <title id="title">PolderGraph — a clear map of your codebase</title>
  <desc id="description">A glowing, interconnected code graph on a deep navy background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.58" stop-color="#111b2e"/>
      <stop offset="1" stop-color="#18243b"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7efff"/>
      <stop offset="1" stop-color="#94a9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#56d6c9"/>
      <stop offset="1" stop-color="#8798ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#596eff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#596eff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1600" height="460" rx="32" fill="url(#background)"/>
  <circle cx="1240" cy="230" r="380" fill="url(#glow)"/>
  <path d="M0 370C290 300 440 470 760 378s448-154 840-40v122H0Z" fill="#182641" opacity=".55"/>
  <path d="M0 407c300-82 479 91 786-7s484-135 814-39" fill="none" stroke="#32456a" stroke-width="2" opacity=".45"/>

