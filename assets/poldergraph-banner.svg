    <circle cx="1230" cy="156" r="12" stroke="#f6b76b"/><circle cx="1330" cy="78" r="10" stroke="#8798ff"/>
    <circle cx="1446" cy="146" r="13" stroke="#65d9cf"/><circle cx="1076" cy="302" r="11" stroke="#8798ff"/>
    <circle cx="1168" cy="241" r="15" stroke="#f6b76b"/><circle cx="1194" cy="337" r="10" stroke="#65d9cf"/>
    <circle cx="1310" cy="241" r="12" stroke="#8798ff"/><circle cx="1440" cy="352" r="11" stroke="#f6b76b"/>
    <circle cx="1492" cy="224" r="9" stroke="#65d9cf"/>
