  <text x="110" y="238" fill="url(#wordmark)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="750" letter-spacing="-3">PolderGraph</text>
  <text x="114" y="290" fill="#c0cde3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="450">A clear map of your codebase.</text>
  <text x="114" y="332" fill="#8395b3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17">Understand faster. Trace confidently. Keep your code and context local.</text>
