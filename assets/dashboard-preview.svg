  <path d="M31 525h184" stroke="#8191a8" stroke-width="2"/><path d="m116 519 11 6-11 6" fill="#8191a8"/>
  <text x="32" y="552" fill="#c9d4e3" font-family="Inter,system-ui,sans-serif" font-size="11">Semantic similarity</text>
