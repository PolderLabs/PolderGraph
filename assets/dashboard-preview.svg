  <text x="1190" y="113" fill="#e0e8f2" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="650">INSPECT</text>
  <text x="1190" y="147" fill="#7f91aa" font-family="Inter,system-ui,sans-serif" font-size="12">METHOD · PYTHON</text>
  <text x="1190" y="178" fill="#cbd9ed" font-family="ui-monospace,monospace" font-size="15">refresh_session</text>
  <text x="1190" y="207" fill="#8fa1bb" font-family="Inter,system-ui,sans-serif" font-size="12">src/auth/session.py:84–107</text>
  <rect x="1188" y="230" width="218" height="1" fill="#303d51"/>
  <text x="1190" y="262" fill="#d7e1ef" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="650">SOURCE</text>
  <rect x="1188" y="278" width="218" height="146" rx="11" fill="#0d1521" stroke="#293950"/>
  <g font-family="ui-monospace,monospace" font-size="10.5">
    <text x="1200" y="301" fill="#62748e">84</text><text x="1225" y="301" fill="#90a7ff">def</text><text x="1247" y="301" fill="#d5dfed">refresh_session</text>
    <text x="1200" y="322" fill="#62748e">85</text><text x="1225" y="322" fill="#a8b6c9">    token = decode(refresh_token)</text>
    <text x="1200" y="343" fill="#62748e">86</text><text x="1225" y="343" fill="#a8b6c9">    session = store.get(token.sub)</text>
    <text x="1200" y="364" fill="#62748e">87</text><text x="1225" y="364" fill="#a8b6c9">    validate(session, token)</text>
    <text x="1200" y="385" fill="#62748e">88</text><text x="1225" y="385" fill="#8ed9ce">    return issue_access(session)</text>
    <text x="1200" y="406" fill="#62748e">89</text>
  </g>
  <text x="1190" y="459" fill="#d7e1ef" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="650">RELATIONSHIPS</text>
  <circle cx="1197" cy="484" r="3" fill="#6e94ff"/><text x="1208" y="488" fill="#b9c8dc" font-family="Inter,system-ui,sans-serif" font-size="11">calls issue_access</text>
  <circle cx="1197" cy="508" r="3" fill="#6e94ff"/><text x="1208" y="512" fill="#b9c8dc" font-family="Inter,system-ui,sans-serif" font-size="11">uses TokenStore</text>
  <circle cx="1197" cy="532" r="3" fill="#65d9cf"/><text x="1208" y="536" fill="#b9c8dc" font-family="Inter,system-ui,sans-serif" font-size="11">related: validate_token</text>
  <rect x="1188" y="561" width="218" height="1" fill="#303d51"/>
  <text x="1190" y="591" fill="#8495ad" font-family="Inter,system-ui,sans-serif" font-size="11">Structural and semantic evidence</text>
  <text x="1190" y="609" fill="#8495ad" font-family="Inter,system-ui,sans-serif" font-size="11">are clearly distinguished.</text>
