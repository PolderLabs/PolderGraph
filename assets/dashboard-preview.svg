<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">PolderGraph interactive repository graph dashboard</title>
  <desc id="desc">A dark code graph interface with filters, a connected graph, search, and a source inspector.</desc>
  <defs>
    <linearGradient id="shell" x2="0" y2="1"><stop stop-color="#151e2e"/><stop offset="1" stop-color="#101723"/></linearGradient>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#0c131f"/><stop offset="1" stop-color="#111d2b"/></linearGradient>
    <linearGradient id="selected" x2="1" y2="1"><stop stop-color="#6e91ff"/><stop offset="1" stop-color="#55d2c6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect x="8" y="8" width="1424" height="744" rx="22" fill="url(#shell)" stroke="#344157" stroke-width="2"/>
  <path d="M9 75h1422" stroke="#303d51"/><path d="M236 76v675M1164 76v675" stroke="#303d51"/>
  <rect x="9" y="9" width="1422" height="66" rx="21" fill="#172131"/><path d="M9 75h1422" stroke="#303d51"/>

