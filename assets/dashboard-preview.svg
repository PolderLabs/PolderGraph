  <rect x="1340" y="25" width="70" height="28" rx="14" fill="#18352f"/><circle cx="1355" cy="39" r="4" fill="#55d2a0"/><text x="1365" y="43" fill="#a9dbc6" font-family="Inter,system-ui,sans-serif" font-size="11">live</text>

