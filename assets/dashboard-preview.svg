  <text x="198" y="110" fill="#7e9dff" font-family="Inter,system-ui,sans-serif" font-size="12">reset</text>
  <text x="32" y="144" fill="#71829a" font-family="Inter,system-ui,sans-serif" font-size="12">Filter by name or path</text>
